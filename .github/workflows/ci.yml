name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  SECRET_KEY: django-insecure-test-key-not-for-production
  DEBUG: "True"
  DB_NAME: test_sonus
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_HOST: localhost
  DB_PORT: "5432"
  DB_SSLMODE: disable
  REDIS_URL: redis://localhost:6379/0
  CORS_ALLOW_ALL_ORIGINS: "True"
  SUPABASE_URL: https://test.supabase.co
  SUPABASE_ANON_KEY: test-anon-key
  SUPABASE_JWT_SECRET: test-jwt-secret
  STRIPE_SECRET_KEY: sk_test_dummy
  STRIPE_PUBLISHABLE_KEY: pk_test_dummy
  STRIPE_WEBHOOK_SECRET: whsec_dummy
  STRIPE_PREMIUM_PRICE_ID: price_test
  GEMINI_API_KEY: test-gemini-key
  JAMENDO_CLIENT_ID: test-jamendo-client

jobs:
  django-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_sonus
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('sonus_brain/sonus_api/sonus_api/sonus_api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: sonus_brain/sonus_api/sonus_api/sonus_api

      - name: Run Django tests with coverage
        run: |
          coverage run -m pytest
          coverage report -m
        working-directory: sonus_brain/sonus_api/sonus_api/sonus_api

  flutter-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sonus_brain/sonus_api/sonus

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.x"
          channel: stable

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('sonus_brain/sonus_api/sonus/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run Flutter tests
        run: flutter test --coverage

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff on Django backend
        run: ruff check
        working-directory: sonus_brain/sonus_api/sonus_api/sonus_api

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.x"
          channel: stable

      - name: Run dart analyze on Flutter app
        run: |
          flutter pub get
          dart analyze --fatal-infos
        working-directory: sonus_brain/sonus_api/sonus
